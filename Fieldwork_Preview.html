  'Simulation & modeling': ['simulation', 'modeling', 'modelling', 'cfd', 'fea', 'finite element', 'ansys', 'computational fluid'],

};
const SKILLS = ['MATLAB', 'Python', 'ANSYS', 'PIV', 'CFD', 'FEA', 'SolidWorks', 'LabVIEW', 'C++', 'Machine learning', 'Data analysis', 'Wind tunnel', 'Instrumentation', 'Heat transfer', 'Fluid mechanics', 'Aerodynamics', 'Turbulence', 'Research and development', 'Experimental design', 'Finite element', 'Thermodynamics', 'CAD', 'Numerical methods', 'ROS2', 'Robotics', 'Control systems', 'Embedded systems', 'Computer vision', 'TypeScript', 'JavaScript', 'React', 'SQL', 'Tableau', 'Power BI', 'Financial modeling', 'Accounting', 'Financial analysis', 'SEO', 'Copywriting', 'Figma', 'UX design', 'User research'];
function hasTerm(text, term) {
  const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

    const caution = /sponsor|export.control|itar|ear\b|u\.?s\.? person|clearance|foreign national|citizenship|permanent residen|\bcpt\b|\bopt\b|f-?1|work authoriz/i.test(s);

function previewResponse(data,status=200){return new Response(JSON.stringify(data),{status,headers:{'Content-Type':'application/json'}});}
globalThis.fetch=async function(input,options={}){
 const u=new URL(input,'http://preview.local'),method=options.method||'GET';
 let data={};try{if(typeof options.body==='string')data=JSON.parse(options.body);}catch{}
 if(u.pathname==='/api/state'){
  const sample=u.searchParams.get('mode')==='demo';
  return previewResponse({...previewDb,jobs:sample?previewDb.jobs.map(j=>({...j,match:matchJob(j,previewDb.profile),eligibility:eligibilityFor(j.description)})):[],skills:SKILLS,areas:Object.keys(AREAS),refreshing:false,mode:sample?'demo':'live'});
 }
 if(u.pathname==='/api/profile'){previewDb.profile={...data,confirmed:true};previewSave();return previewResponse({profile:previewDb.profile});}
 if(u.pathname==='/api/suggest')return previewResponse(suggestProfile(data.text||''));
 if(u.pathname.startsWith('/api/activity/')){const j=previewDb.jobs.find(j=>j.id===u.pathname.split('/').pop());if(j)Object.assign(j,data);previewSave();return previewResponse({ok:true});}
 if(u.pathname==='/api/schedule'){previewDb.schedule=data;previewSave();return previewResponse({ok:true});}
 if(u.pathname==='/api/extract'){
  const filename=decodeURIComponent(options.headers['x-filename']||'file.txt');
  if(!/\.(txt|md)$/i.test(filename))return previewResponse({error:'PDF and DOCX import are available in the full local app. This sample preview supports TXT and Markdown.'},400);
  const text=await options.body.text();return previewResponse({text,filename,suggestions:suggestProfile(text)});
 }
 return previewResponse({error:'This is the interactive sample preview. Start the included local app for live sources, real listings, and scheduled collection.'},400);
};

function googleJobQuery() {
  const profile = state.profile;
  const focus = search.trim()
    || (filters.area !== 'All' ? filters.area : '')
    || profile.searchTerms?.find(term => term.trim())?.trim()
    || profile.areas?.[0]
    || profile.skills?.[0]
    || '';
  const date = page === 'internship'
    ? [filters.season === 'Summer' ? 'summer' : '', filters.year].filter(Boolean).join(' ')
    : '';
  const role = page === 'internship'
    ? (/\b(?:intern(?:ship)?s?|co[ -]?op)\b/i.test(focus) ? '' : 'internship')
    : (/\bfull[ -]time\b/i.test(focus) ? '' : 'full-time jobs');
  const sector = {
    Academia: 'university',
    'National laboratory': 'national laboratory',
    Industry: 'industry',
  }[organization];
  const workplace = ['Remote', 'Hybrid', 'On-site'].includes(filters.workplace) ? filters.workplace : '';
  return [date, focus, role, sector, filters.location.trim(), workplace].filter(Boolean).join(' ');
}

function renderGoogleSearch() {
  const link = $('#google-job-search');

  const url = new URL('https://www.google.com/search');

  link.href = url.href;
  $('#google-query').textContent = query;
}

function filterCount(){return Number(filters.area!=='All')+Number(filters.eligibility!=='open')+Number(filters.season!=='All')+Number(Boolean(filters.year))+Number(Boolean(filters.location))+Number(filters.degree!=='All')+Number(filters.workplace!=='All')+Number(filters.includeClosed);}
function visibleJobs(){
  return state.jobs.filter(j=>{
    if(page==='internship'&&j.kind!=='internship'||page==='fulltime'&&j.kind!=='fulltime'||page==='other'&&j.kind!=='other'||page==='saved'&&j.status!=='saved'||page==='applications'&&!['applied','interview','offer','rejected'].includes(j.status))return false;
    const browsing=['internship','fulltime','other'].includes(page);
    if(!filters.includeClosed&&!j.active&&browsing)return false;
    if(j.status==='dismissed'&&browsing)return false;
    if(organization!=='All'&&j.organization!==organization)return false;
    if(search&&!`${j.title} ${j.company} ${j.description} ${j.location} ${j.tags.join(' ')}`.toLowerCase().includes(search.toLowerCase()))return false;
    if(filters.area!=='All'&&!j.tags.includes(filters.area))return false;
    if(filters.eligibility==='open'&&j.eligibility.status==='restricted'&&browsing)return false;
    if(['explicit','review','restricted'].includes(filters.eligibility)&&j.eligibility.status!==filters.eligibility)return false;
    if(filters.location&&!j.location.toLowerCase().includes(filters.location.toLowerCase()))return false;
    if(filters.workplace!=='All'&&j.workplace!==filters.workplace)return false;
    if(filters.degree==='graduate'&&j.degree==='Undergraduate only')return false;
    if(page==='internship'){
      if(filters.season!=='All'&&j.season!==filters.season&&!(filters.includeUnknown&&j.season==='Not specified'))return false;
      if(filters.year&&String(j.year)!==filters.year&&!(filters.includeUnknown&&!j.year))return false;
    }
    return true;
  }).sort((a,b)=>sort==='match'?b.match.score-a.match.score:sort==='company'?a.company.localeCompare(b.company):sort==='deadline'?(Date.parse(a.deadline)||Infinity)-(Date.parse(b.deadline)||Infinity):(Date.parse(b.firstSeen)||0)-(Date.parse(a.firstSeen)||0));
}

}
function sourceModal(){openModal(`${modalHead('EXPAND YOUR SEARCH','Connect a job board')}<p class="small-copy">Use the company’s public Greenhouse, Lever, or Ashby career-board URL. This collects that company’s published roles.</p><form id="source-form"><label>Organization name<input name="company" placeholder="e.g. A company you want to follow" required maxlength="160"></label><div class="form-grid"><label>Organization type<select name="organization"><option>Industry</option><option>Academia</option><option>National laboratory</option></select></label><label>Career-board provider<select name="provider"><option value="greenhouse">Greenhouse</option><option value="lever">Lever</option><option value="ashby">Ashby</option></select></label></div><label>Public board URL or board name<input name="slug" placeholder="https://job-boards.greenhouse.io/company" required><small>Use the board homepage, not a single job URL. Global Lever boards are supported.</small></label><div class="form-bottom"><span class="small-copy">No API key needed.</span><button class="button primary" type="submit">Connect source ${icon('plus')}</button></div></form>`);}
function addJobModal(){openModal(`${modalHead('ADD A POSSIBILITY','Save an opportunity')}<p class="small-copy">Add a real role from any academic, laboratory, or employer website. Paste its description so matching and eligibility screening can work.</p><form id="job-form"><label>Role title<input name="title" required maxlength="250"></label><div class="form-grid"><label>Organization<input name="company" required maxlength="160"></label><label>Organization type<select name="organization"><option>Industry</option><option>Academia</option><option>National laboratory</option></select></label><label>Role type<select name="kind"><option value="internship">Internship</option><option value="fulltime">Full-time</option><option value="other">Other / unspecified</option></select></label><label>Location<input name="location" placeholder="City, state / Remote"></label><label>Season<select name="season"><option>Summer</option><option>Not specified</option></select></label><label>Year<input name="year" type="number" min="2026" max="2040" value="${state.profile.targetYear}"></label><label>Degree eligibility<select name="degree"><option>Not specified</option><option>Graduate</option><option>Undergraduate only</option></select></label><label>Deadline, if provided<input name="deadline" type="date"></label></div><label>Original posting URL<input name="url" type="url" placeholder="https://…" required></label><label>Full job description<textarea name="description" rows="7" required placeholder="Include qualifications, citizenship, work authorization, and sponsorship wording."></textarea></label><div class="form-bottom"><span class="small-copy">Added to the live workspace.</span><button class="button primary" type="submit">Save opportunity ${icon('plus')}</button></div></form>`,true);}
function filterModal(){openModal(`${modalHead('MAKE ROOM FOR THE RIGHT FIT','Refine your search')}<form id="filter-form"><div class="form-grid"><label>Research focus<select name="area">${['All',...state.areas].map(a=>`<option ${a===filters.area?'selected':''}>${esc(a)}</option>`).join('')}</select></label><label>Eligibility evidence<select name="eligibility">${[['open','Hide explicit conflicts'],['explicit','CPT acceptance stated'],['review','Needs verification'],['restricted','Explicit conflicts'],['all','All statuses']].map(([v,l])=>`<option value="${v}" ${v===filters.eligibility?'selected':''}>${l}</option>`).join('')}</select></label><label>Season<select name="season">${['Summer','All'].map(a=>`<option ${a===filters.season?'selected':''}>${a}</option>`).join('')}</select></label><label>Internship year<input name="year" type="number" min="2026" max="2040" value="${esc(filters.year)}" placeholder="Any year"></label><label>Location contains<input name="location" value="${esc(filters.location)}" placeholder="e.g. AZ, Michigan, Remote"></label><label>Work arrangement<select name="workplace">${['All','On-site','Hybrid','Remote','Not specified'].map(a=>`<option ${a===filters.workplace?'selected':''}>${a}</option>`).join('')}</select></label><label>Education filter<select name="degree"><option value="graduate" ${filters.degree==='graduate'?'selected':''}>Hide undergraduate-only roles</option><option value="All" ${filters.degree==='All'?'selected':''}>All education levels</option></select></label></div><label class="check"><input type="checkbox" name="includeUnknown" ${filters.includeUnknown?'checked':''}>Include internships whose season or year needs verification</label><label class="check"><input type="checkbox" name="includeClosed" ${filters.includeClosed?'checked':''}>Include inactive listings</label><p class="small-copy">Season and year apply to the Internships section. Saved roles and applications remain visible even if a listing closes.</p><div class="form-bottom"><button type="button" class="text-button" data-action="reset-filters">Reset filters</button><button class="button primary" type="submit">Show opportunities ${icon('arrow')}</button></div></form>`);}
async function importFiles(files){
  if(!files.length)return;
  profileDraft=captureProfile();toast('Reading your documents…');
  let text='',names=[],errors=[];
  for(const file of files){
    try{if(file.size>10*1024*1024)throw new Error('File exceeds 10 MB');const result=await api('/api/extract',{method:'POST',body:file,headers:{'x-filename':encodeURIComponent(file.name),'Content-Type':'application/octet-stream'}});text+=`\n\n--- ${file.name} ---\n${result.text}`;names.push(file.name);}catch(e){errors.push(`${file.name}: ${e.message}`);}
  }
  if(!text){toast(errors.join(' · '));return;}
  const suggestions=await api('/api/suggest',{method:'POST',body:JSON.stringify({text})});
  importDraft={text,names,suggestions};
  showSuggestions(errors);
}
function showSuggestions(errors=[]){
  const {text,names,suggestions}=importDraft;
  openModal(`${modalHead('YOUR EXPERIENCE, IN FOCUS','Review document suggestions')}<p class="small-copy">${names.map(esc).join(', ')} · ${suggestions.words.toLocaleString()} words. Select what belongs in your profile. Nothing is saved until you save the profile.</p>${errors.length?`<div class="warning-box">${errors.map(esc).join('<br>')}</div>`:''}<form id="import-form"><fieldset><legend>Recognized skills</legend><div class="check-grid">${suggestions.skills.length?suggestions.skills.map(s=>`<label class="check"><input type="checkbox" name="skills" value="${esc(s)}" checked>${esc(s)}</label>`).join(''):'<p>No known skill terms found. You can enter your own skills in the profile.</p>'}</div></fieldset><fieldset><legend>Research areas</legend><div class="check-grid">${suggestions.areas.map(a=>`<label class="check"><input type="checkbox" name="areas" value="${esc(a)}" checked>${esc(a)}</label>`).join('')||'<p>No predefined areas detected.</p>'}</div></fieldset><label>Extracted text<textarea name="text" rows="8">${esc(text)}</textarea></label><p class="small-copy">This is local keyword extraction. Review the text for PDF formatting errors and add any missing expertise yourself.</p><div class="form-bottom"><button class="button" type="button" data-action="close-modal">Cancel</button><button class="button primary" type="submit">Add to profile draft ${icon('arrow')}</button></div></form>`,true);
}
document.addEventListener('click',async event=>{
  const target=event.target.closest('button, a[data-page]');if(!target)return;
  try{
    if(target.dataset.page){if(page==='profile')profileDraft=captureProfile();page=target.dataset.page;location.hash=page;render();window.scrollTo(0,0);return;}
    if(target.dataset.job){details(target.dataset.job);return;}
    if(target.dataset.org){organization=target.dataset.org;render();return;}
    if(target.dataset.layout){layout=target.dataset.layout;render();return;}
    if(target.dataset.save){const j=state.jobs.find(j=>j.id===target.dataset.save);if(!['new','saved','dismissed'].includes(j.status)){details(j.id);return;}await mutate(`/api/activity/${j.id}`,'PUT',{status:j.status==='saved'?'new':'saved',notes:j.notes});render();toast(j.status==='saved'?'Removed from saved roles':'Saved to your shortlist');return;}
    if(target.dataset.removeFilter){const key=target.dataset.removeFilter;if(key==='season'){filters.season='All';filters.year='';}else filters[key]=key==='eligibility'?'open':'All';render();return;}
    if(target.dataset.toggleSource){const s=state.sources.find(s=>s.id===target.dataset.toggleSource);await mutate(`/api/sources/${s.id}`,'PATCH',{enabled:!s.enabled});render();return;}
    if(target.dataset.deleteSource){await mutate(`/api/sources/${target.dataset.deleteSource}`,'DELETE');render();toast('Source removed. Its listings are marked inactive; your notes are preserved.');return;}
    const action=target.dataset.action;
    if(action==='sign-out'){await api('/api/logout',{method:'POST'});location.reload();return;}
    if(action==='register-view'){renderSignIn(true);return;}
    if(action==='login-view'){renderSignIn();return;}
    if(action==='close-modal')closeModal();
    if(action==='filter-modal')filterModal();
    if(action==='add-source')sourceModal();
    if(action==='add-job')addJobModal();
    if(action==='toggle-mode'){mode=mode==='demo'?'live':'demo';storage.set('fieldwork-mode',mode);await reload();render();}
    if(action==='upload'){$('#document-input').value='';$('#document-input').click();}
    if(action==='reset-filters'){filters={area:'All',eligibility:'open',season:'All',year:'',location:'',degree:'All',workplace:'All',includeUnknown:true,includeClosed:false};organization='All';search='';if(modal.open)closeModal();render();}
    if(action==='disconnect-adzuna'){await api('/api/discovery',{method:'DELETE'});await reload();render();toast('Adzuna disconnected.');}
    if(action==='refresh'){target.disabled=true;target.innerHTML=icon('refresh','spin')+'Refreshing…';try{const result=await api('/api/refresh',{method:'POST',body:'{}'});mode='live';storage.set('fieldwork-mode',mode);await reload();render();toast(`${result.added} new roles · ${result.succeeded} sources checked${result.failed?` · ${result.failed} failed; see source details`:''}`);}finally{if(target.isConnected){target.disabled=false;target.innerHTML=icon('refresh')+'Search now';}}}
    if(action==='suggest-projects'){profileDraft=captureProfile();const text=profileDraft.projects;if(!text.trim()){toast('Add a project description first.');return;}const suggestions=await api('/api/suggest',{method:'POST',body:JSON.stringify({text})});importDraft={text,names:['Project descriptions'],suggestions};showSuggestions();}
    if(action==='review-text'){profileDraft=captureProfile();openModal(`${modalHead('YOUR IMPORTED EXPERIENCE','Review extracted text')}<form id="text-form"><label>Resume and CV text<textarea name="text" rows="18">${esc(profileDraft.resumeText)}</textarea></label><button class="button primary" type="submit">Update draft text</button></form>`,true);}
  }catch(e){toast(e.message);}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;renderResults();}});
document.addEventListener('change',async e=>{if(e.target.id==='sort'){sort=e.target.value;renderResults();}if(e.target.id==='document-input')try{await importFiles([...e.target.files]);}catch(err){toast(err.message);}});
document.addEventListener('submit',async e=>{
  e.preventDefault();const form=e.target;const button=form.querySelector('button[type="submit"]');const f=new FormData(form);const values=Object.fromEntries(f);if(button)button.disabled=true;
  try{
    if(form.id==='auth-form'){
      await api(form.dataset.register==='true'?'/api/register':'/api/login',{method:'POST',body:JSON.stringify(values)});
      await openWorkspace();
      return;
    }
    if(form.id==='profile-form'){const p=captureProfile();if(!p.keepResumeText)p.resumeText='';await mutate('/api/profile','PUT',p);profileDraft=null;filters.year=String(state.profile.targetYear);render();toast('Profile saved. Match rankings and discovery keywords updated.');}
    if(form.id==='source-form'){await mutate('/api/sources','POST',values);closeModal();mode='live';storage.set('fieldwork-mode',mode);await reload();page='sources';render();toast('Source connected. Select Search now to collect listings.');}
    if(form.id==='discovery-form'){await mutate('/api/discovery','PUT',values);render();toast('Adzuna enabled. Select Search now to collect listings.');}
    if(form.id==='schedule-form'){await mutate('/api/schedule','PUT',{enabled:f.has('enabled'),intervalHours:Number(values.intervalHours)});render();toast('Refresh schedule saved. Keep the app running for automatic checks.');}
    if(form.id==='filter-form'){filters={...values,includeUnknown:f.has('includeUnknown'),includeClosed:f.has('includeClosed')};closeModal();render();}
    if(form.id==='activity-form'){await mutate(`/api/activity/${form.dataset.id}`,'PUT',values);closeModal();render();toast('Application status and notes saved.');}
    if(form.id==='job-form'){await mutate('/api/jobs','POST',values);closeModal();mode='live';storage.set('fieldwork-mode',mode);await reload();page=values.kind==='fulltime'?'fulltime':values.kind==='other'?'other':'internship';render();toast('Opportunity added. Eligibility evidence has been screened.');}
    if(form.id==='import-form'){profileDraft={...(profileDraft||state.profile),skills:[...new Set([...(profileDraft||state.profile).skills,...f.getAll('skills')])],areas:[...new Set([...(profileDraft||state.profile).areas,...f.getAll('areas')])],resumeText:((profileDraft||state.profile).resumeText+'\n\n'+values.text).trim()};closeModal();page='profile';render();toast('Suggestions added to your draft. Review and save your profile.');}
    if(form.id==='text-form'){profileDraft={...(profileDraft||state.profile),resumeText:values.text};closeModal();render();toast('Draft text updated. Save your profile to keep it.');}
  }catch(err){toast(err.message);}finally{if(button?.isConnected)button.disabled=false;}
});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search')?.focus();}});
modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(state&&viewNames[next]&&next!==page){if(page==='profile')profileDraft=captureProfile();page=next;render();}});
async function openWorkspace(){
  const requested=location.hash.slice(1);
  if(Object.hasOwn(viewNames,requested))page=requested;
  await reload();
  filters.year=String(state.profile.targetYear);
  render();
}
function renderSignIn(register=false){
  $('#app').innerHTML=`<main class="auth-screen"><section class="panel">
    <a class="brand" href="/"><img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Crect%20width%3D%2248%22%20height%3D%2248%22%20rx%3D%2214%22%20fill%3D%22%23264d40%22%2F%3E%3Cpath%20d%3D%22M15%2034V15h19v5H21v5h10v5H21v4z%22%20fill%3D%22%23edf5e9%22%2F%3E%3Ccircle%20cx%3D%2234%22%20cy%3D%2233%22%20r%3D%223%22%20fill%3D%22%23c8db9e%22%2F%3E%3C%2Fsvg%3E%0A" width="37" height="37" alt="">Fieldwork</a>
    <h1>${register?'Create an account':'Sign in to Fieldwork'}</h1>
    <p class="small-copy">Each account has its own résumé profile, searches, and saved jobs.</p>
    <form id="auth-form" data-register="${register}">
      <label>Email<input name="email" type="email" autocomplete="username" maxlength="254" required></label>
      <label>Password<input name="password" type="password" autocomplete="${register?'new-password':'current-password'}" minlength="12" maxlength="256" required></label>
      <button type="submit" class="button primary">${register?'Create account':'Sign in'}</button>
      <button type="button" class="button" data-action="${register?'login-view':'register-view'}">${register?'Back to sign in':'Create account'}</button>
    </form>
  </section></main>`;
}
try{
  if(globalThis.FIELDWORK_PREVIEW || (await api('/api/session')).email)await openWorkspace();
  else renderSignIn();
}catch(e){
  $('#app').innerHTML=`<div class="startup-error"><h1>Could not open Fieldwork</h1><p>${esc(e.message)}</p></div>`;
}
</script></body></html>
